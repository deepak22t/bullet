<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StoryPulse | Golden Edition</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar">
        <div class="brand">
          <i data-lucide="crown" class="icon-accent"></i>
          <span>StoryPulse</span>
        </div>
        
        <div class="input-section">
          <div class="input-group">
            <label>Script Title</label>
            <input id="title" value="The Last Message" />
          </div>

          <div class="input-group">
            <label>Scene Premise</label>
            <textarea id="scene">Riya receives a message from her ex-boyfriend after five years.</textarea>
          </div>

          <div class="input-group">
            <label>Dialogue</label>
            <textarea id="dialogue" class="tall">Riya: Why now?
Arjun: Because today I learned the truth.
Riya: What truth?
Arjun: That the accident wasn't your fault.</textarea>
          </div>

          <button id="analyzeBtn" class="primary-btn">
            <i data-lucide="sparkles"></i>
            <span>Analyze</span>
          </button>
          
          <div id="status" class="status-indicator">
            <span class="dot"></span>
            <span id="statusText">System Ready</span>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <div id="emptyState" class="empty-state">
          <i data-lucide="layout" size="40"></i>
          <p>Awaiting Script Data</p>
        </div>

        <div id="resultsView" class="results-view hidden">
          <!-- TOP ROW: Summary & Metrics -->
          <header class="results-header">
            <div class="summary-card glass">
              <div class="label">Script Summary</div>
              <p id="summaryText"></p>
            </div>
            
            <div class="metric-card glass">
              <i data-lucide="trending-up" size="16" class="icon-accent"></i>
              <div class="metric-value" id="engagementScore">0%</div>
              <div class="metric-label">Engagement</div>
            </div>

            <div class="metric-card glass">
              <i data-lucide="music" size="16" class="icon-accent"></i>
              <div class="metric-value" id="overallTone" style="font-size: 14px; text-transform: capitalize;">-</div>
              <div class="metric-label">Overall Tone</div>
            </div>
          </header>

          <!-- MIDDLE ROW: Arc (Left) & Sidebar (Right) -->
          <div class="main-display-grid">
            <div class="arc-panel panel glass">
              <div class="panel-header">
                <i data-lucide="activity"></i>
                <h3>Emotional Arc</h3>
              </div>
              <div id="arcTimeline" class="timeline"></div>
            </div>

            <div class="side-col">
              <section class="panel glass">
                <div class="panel-header">
                  <i data-lucide="zap"></i>
                  <h3>Impact Factors</h3>
                </div>
                <div id="factorsList" class="factors-list"></div>
              </section>

              <section id="cliffhangerCard" class="panel glass cliff-panel hidden">
                <div class="panel-header">
                  <i data-lucide="flame"></i>
                  <h3>Cliffhanger</h3>
                </div>
                <div id="cliffhangerContent"></div>
              </section>
            </div>
          </div>

          <!-- BOTTOM ROW: Suggestions (Horizontal Grid) -->
          <section class="suggestions-panel panel glass">
            <div class="panel-header">
              <i data-lucide="edit-3"></i>
              <h3>Suggested Improvements</h3>
            </div>
            <div id="improvementsList" class="improvement-grid"></div>
          </section>
          
          <details class="raw-data">
            <summary>Raw Data</summary>
            <pre id="rawOutput"></pre>
          </details>
        </div>
      </main>
    </div>

    <script src="app.js"></script>
    <script>lucide.createIcons();</script>
  </body>
</html>
